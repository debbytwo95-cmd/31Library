<!doctype html><meta charset="utf-8"><style>body{background:#202024;color:white;font:15px sans-serif;margin:20px}canvas{max-width:100%;}video{width:300px}</style><h2 id="info">读取视频…</h2><canvas id="sheet"></canvas><video id="video" src="../uiuxarih.mp4" controls muted></video><script>
const v=document.querySelector('video'),c=document.querySelector('canvas'),x=c.getContext('2d');v.onloadedmetadata=async()=>{document.querySelector('#info').textContent=`${v.videoWidth} × ${v.videoHeight} · ${v.duration.toFixed(2)} 秒`;let w=280,h=w*v.videoHeight/v.videoWidth;c.width=w*4;c.height=(h+30)*3;for(let i=0;i<12;i++){let t=v.duration*i/12;await new Promise(r=>{v.onseeked=r;v.currentTime=Math.max(.01,t)});x.drawImage(v,(i%4)*w,Math.floor(i/4)*(h+30),w,h);x.fillStyle='white';x.font='16px sans-serif';x.fillText(t.toFixed(2)+'s',(i%4)*w+10,Math.floor(i/4)*(h+30)+h+20)} };
</script>
